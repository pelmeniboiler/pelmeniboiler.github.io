<main id="slug-converter-module" class="window init-closed" aria-labelledby="slug-converter-module-title">
    <div class="title-bar">
        <span class="title" data-key="win_slug_converter_title" id="slug-converter-module-title"><span class="symbol" aria-hidden="true"><span class="emoji"><svg aria-hidden="true" focusable="false" style="width:0.869em;height:1em;vertical-align:-0.216em"><use href="/styles/emoji/sprite.svg?v=d08c70d8#e2b80"></use></svg><span class="emoji-t">⮀</span></span></span> slug.converter</span>
        <button class="close-btn" aria-label="Close">&times;</button>
    </div>
    <div class="content graflect-tool-content">
        <div class="text-areas">
            <textarea id="graflect-input" data-key-placeholder="slug_input_placeholder" placeholder="Paste Graflect text here..."></textarea>
            <textarea id="slug-output" readonly data-key-placeholder="slug_output_placeholder" placeholder="SLUG output appears here..."></textarea>
        </div>
        <div class="converter-buttons">
            <button id="clear-slug-btn" class="normal-btn" data-key="slug_clear_btn">Clear</button>
        </div>
    </div>
</main>
