<!DOCTYPE html>
<html lang="en">
<head>
    <link id="dynamic-favicon" rel="icon" href="/logo/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="/styles/fonts/FrankRuhl.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/scripts/theme-loader.js"></script>
    <link rel="stylesheet" href="/styles/pelmeni2025.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Symbol and Emoji Viewer</title>

    
    <style>
        /* Site rules apply here too: only the theme's background and text
           colours, square corners, no shadows, no greys. */
        body {
            font-family: var(--font-body);
            margin: 0;
            padding: 0 0 40px;
            line-height: 1.5;
            overflow: auto;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        .container { max-width: 1200px; margin: 2rem auto; padding: 1rem; }
        h1 {
            text-align: center;
            border-bottom: 2px solid var(--text-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-family: 'Selyodka', var(--font-body);
        }
        .unicode-block {
            margin-bottom: 3rem;
            background-color: var(--win-bg-color);
            border: 2px solid var(--text-color);
            padding: 1.5rem;
        }
        .unicode-block h2 {
            margin-top: 0;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--text-color);
        }
        .symbol-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
            gap: 1rem;
        }
        /* One character: the fonts that lost on the left, the winner big. */
        .symbol-item {
            display: grid;
            grid-template-columns: 1.4rem 1fr;
            grid-template-areas: "stack glyph" "code code";
            align-items: center;
            gap: 0.25rem;
            padding: 0.5rem;
            border: 1px solid var(--text-color);
            background-color: var(--win-bg-color);
            color: var(--text-color);
            cursor: var(--cur-pointer, pointer);
            font: inherit;
        }
        .symbol-item:hover, .symbol-item:focus-visible {
            background-color: var(--text-color);
            color: var(--win-bg-color);
            outline: none;
        }
        .symbol-item .glyph {
            grid-area: glyph;
            font-size: 2.5rem;
            line-height: 1.2;
            text-align: center;
            font-variant-emoji: text;
        }
        /* The rest of the stack for this character, in stack order: the font
           nearest the top is the next one in line after the winner. */
        .symbol-item .stack {
            grid-area: stack;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            font-size: 0.8rem;
            line-height: 1.1;
            font-variant-emoji: text;
        }
        .symbol-item code {
            grid-area: code;
            justify-self: center;
            font-size: 0.75rem;
            border: 1px solid currentColor;
            padding: 0 4px;
        }
        #copy-notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 8px 20px;
            z-index: 1000;
        }
        #copy-notification:not(.show) { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Unicode Symbol &amp; Emoji Viewer</h1>
        <div id="symbol-container">
            <!-- Unicode blocks will be generated here by JavaScript -->
        </div>
    </div>
    
    <div id="copy-notification">Copied!</div>

    <script>
        // Wait for the document to be fully loaded before running the script
        document.addEventListener('DOMContentLoaded', () => {

            // List of ISO 3166-1 alpha-2 country codes for generating flags
            const countryCodes = ['AD', 'AE', 'AF', 'AG', 'AI', 'AL', 'AM', 'AO', 'AQ', 'AR', 'AS', 'AT', 'AU', 'AW', 'AX', 'AZ', 'BA', 'BB', 'BD', 'BE', 'BF', 'BG', 'BH', 'BI', 'BJ', 'BL', 'BM', 'BN', 'BO', 'BR', 'BS', 'BT', 'BW', 'BY', 'BZ', 'CA', 'CC', 'CD', 'CF', 'CG', 'CH', 'CI', 'CK', 'CL', 'CM', 'CN', 'CO', 'CR', 'CU', 'CV', 'CW', 'CX', 'CY', 'CZ', 'DE', 'DJ', 'DK', 'DM', 'DO', 'DZ', 'EC', 'EE', 'EG', 'EH', 'ER', 'ES', 'ET', 'FI', 'FJ', 'FK', 'FM', 'FO', 'FR', 'GA', 'GB', 'GD', 'GE', 'GF', 'GG', 'GH', 'GI', 'GL', 'GM', 'GN', 'GP', 'GQ', 'GR', 'GS', 'GT', 'GU', 'GW', 'GY', 'HK', 'HN', 'HR', 'HT', 'HU', 'ID', 'IE', 'IL', 'IM', 'IN', 'IO', 'IQ', 'IR', 'IS', 'IT', 'JE', 'JM', 'JO', 'JP', 'KE', 'KG', 'KH', 'KI', 'KM', 'KN', 'KP', 'KR', 'KW', 'KY', 'KZ', 'LA', 'LB', 'LC', 'LI', 'LK', 'LR', 'LS', 'LT', 'LU', 'LV', 'LY', 'MA', 'MC', 'MD', 'ME', 'MF', 'MG', 'MH', 'MK', 'ML', 'MM', 'MN', 'MO', 'MP', 'MQ', 'MR', 'MS', 'MT', 'MU', 'MV', 'MW', 'MX', 'MY', 'MZ', 'NA', 'NC', 'NE', 'NF', 'NG', 'NI', 'NL', 'NO', 'NP', 'NR', 'NU', 'NZ', 'OM', 'PA', 'PE', 'PF', 'PG', 'PH', 'PK', 'PL', 'PM', 'PN', 'PR', 'PS', 'PT', 'PW', 'PY', 'QA', 'RE', 'RO', 'RS', 'RU', 'RW', 'SA', 'SB', 'SC', 'SD', 'SE', 'SG', 'SH', 'SI', 'SJ', 'SK', 'SL', 'SM', 'SN', 'SO', 'SR', 'SS', 'ST', 'SV', 'SX', 'SY', 'SZ', 'TC', 'TD', 'TF', 'TG', 'TH', 'TJ', 'TK', 'TL', 'TM', 'TN', 'TO', 'TR', 'TT', 'TV', 'TW', 'TZ', 'UA', 'UG', 'US', 'UY', 'UZ', 'VA', 'VC', 'VE', 'VG', 'VI', 'VN', 'VU', 'WF', 'WS', 'YE', 'YT', 'ZA', 'ZM', 'ZW'];

            // Define the Unicode blocks to display
            const unicodeBlocks = [
                // NEW: Added a block for National Flags, using the countryCodes array
                { name: 'National Flags', type: 'flags', codes: countryCodes },
                { name: 'Miscellaneous Symbols', start: 0x2600, end: 0x26FF },
                { name: 'Dingbats', start: 0x2700, end: 0x27BF },
                { name: 'Miscellaneous Symbols and Arrows', start: 0x2B00, end: 0x2BFF },
                { name: 'Playing Cards', start: 0x1F0A0, end: 0x1F0FF },
                { name: 'Miscellaneous Symbols and Pictographs', start: 0x1F300, end: 0x1F5FF },
                { name: 'Emoticons', start: 0x1F600, end: 0x1F64F },
                { name: 'Transport and Map Symbols', start: 0x1F680, end: 0x1F6FF },
                { name: 'Alchemical Symbols', start: 0x1F700, end: 0x1F77F },
                { name: 'Geometric Shapes Extended', start: 0x1F780, end: 0x1F7FF },
                { name: 'Supplemental Arrows-C', start: 0x1F800, end: 0x1F8FF },
                { name: 'Supplemental Symbols and Pictographs', start: 0x1F900, end: 0x1F9FF },
                { name: 'Symbols for Legacy Computing', start: 0x1FB00, end: 0x1FBFF },
            ];

            const mainContainer = document.getElementById('symbol-container');
            const notification = document.getElementById('copy-notification');

            let notificationTimeout;
            function showNotification() {
                if (notificationTimeout) clearTimeout(notificationTimeout);
                notification.classList.add('show');
                notificationTimeout = setTimeout(() => notification.classList.remove('show'), 2000);
            }

            function copyToClipboard(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                try { document.execCommand('copy'); showNotification(); }
                catch (err) { console.error('Failed to copy text: ', err); }
                document.body.removeChild(textarea);
            }

            // Is codepoint cp inside the sorted [start, end] ranges?
            function inRanges(ranges, cp) {
                let lo = 0, hi = ranges.length - 1;
                while (lo <= hi) {
                    const mid = (lo + hi) >> 1;
                    if (cp < ranges[mid][0]) hi = mid - 1;
                    else if (cp > ranges[mid][1]) lo = mid + 1;
                    else return true;
                }
                return false;
            }

            // stack: [{family, name, ranges}] in priority order, written by
            // build/emoji.mjs. Without it (not built yet) every character is
            // simply drawn by the whole stack, with no layers shown.
            function render(stack) {
                const emojiStack = getComputedStyle(document.documentElement).getPropertyValue('--font-emoji');

                function createSymbolItem(grid, char, codeText, fonts) {
                    const item = document.createElement('button');
                    item.type = 'button';
                    item.className = 'symbol-item';

                    const layers = document.createElement('span');
                    layers.className = 'stack';
                    const glyph = document.createElement('span');
                    glyph.className = 'glyph';
                    glyph.textContent = char;

                    if (fonts && fonts.length) {
                        const [winner, ...rest] = fonts;
                        glyph.style.fontFamily = `'${winner.family}'`;
                        for (const f of rest) {
                            const mini = document.createElement('span');
                            mini.style.fontFamily = `'${f.family}'`;
                            mini.textContent = char;
                            mini.title = f.name;
                            layers.appendChild(mini);
                        }
                        item.title = [winner, ...rest].map((f) => f.name).join(' › ');
                    } else {
                        glyph.style.fontFamily = emojiStack;
                        
                    }

                    const codeTag = document.createElement('code');
                    codeTag.textContent = codeText;

                    item.addEventListener('click', () => copyToClipboard(char));
                    item.append(layers, glyph, codeTag);
                    grid.appendChild(item);
                }

                unicodeBlocks.forEach((block) => {
                    const blockDiv = document.createElement('div');
                    blockDiv.className = 'unicode-block';
                    const blockTitle = document.createElement('h2');
                    blockTitle.textContent = block.type === 'flags'
                        ? block.name
                        : `${block.name} (U+${block.start.toString(16).toUpperCase()} - U+${block.end.toString(16).toUpperCase()})`;
                    blockDiv.appendChild(blockTitle);

                    const gridDiv = document.createElement('div');
                    gridDiv.className = 'symbol-grid';

                    if (block.type === 'flags') {
                        // A flag is two Regional Indicator letters that a font
                        // joins into one glyph; which fonts do that isn't in
                        // the per-codepoint data, so flags show no layers.
                        block.codes.forEach((countryCode) => {
                            const A = 0x1F1E6, a = 'A'.charCodeAt(0);
                            const flag = String.fromCodePoint(A + countryCode.charCodeAt(0) - a, A + countryCode.charCodeAt(1) - a);
                            createSymbolItem(gridDiv, flag, countryCode, null);
                        });
                    } else {
                        for (let i = block.start; i <= block.end; i++) {
                            const char = String.fromCodePoint(i);
                            if (/\p{Cn}/u.test(char)) continue; // unassigned
                            const fonts = stack ? stack.filter((f) => inRanges(f.ranges, i)) : null;
                            if (stack && !fonts.length) continue; // nothing in our stack draws it
                            createSymbolItem(gridDiv, char, `U+${i.toString(16).toUpperCase().padStart(4, '0')}`, fonts);
                        }
                    }

                    if (!gridDiv.children.length) return;
                    blockDiv.appendChild(gridDiv);
                    mainContainer.appendChild(blockDiv);
                });
            }

            fetch('/styles/emoji/stack.json')
                .then((res) => (res.ok ? res.json() : null))
                .catch(() => null)
                .then(render);
        });
    </script>

</body>
</html>
