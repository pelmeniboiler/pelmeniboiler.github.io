<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <link id="dynamic-favicon" rel="icon" href="/logo/favicon.svg">
    <script src="/scripts/theme-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sofrut II — article scribe</title>
    <link rel="stylesheet" href="/styles/pelmeni2025.css">
    <style>
        /* Sofrut II: write a post the way it will look, then publish the two files
           the build wants (blog/<slug>.html + localization/<prefix>.json).
           Site rules apply: the theme's two colours only. */
        body { overflow: auto; padding: 12px 12px 48px; box-sizing: border-box; }
        .forge { max-width: 960px; margin: 0 auto; }
        /* The article pane is not a .window: the site's window manager would make it draggable and closable. */
        .sheet { position: relative; border: 2px solid var(--border-color); background-color: var(--win-bg-color); color: var(--text-color); }
        .sheet > .title-bar { cursor: var(--cur-default); }
        .sheet > .title-bar .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        @media (min-width: 900px) {
            html, body { height: 100%; }
            body { overflow: hidden; padding: 10px 10px 40px; }
            .forge { height: calc(100vh - 50px); }
            .pane-doc { display: flex; flex-direction: column; height: 100%; min-height: 0; }
            .pane-doc > .content { flex: 1; display: flex; flex-direction: column; min-height: 0; max-height: none; overflow: hidden; padding: 0; }
            #doc-wrap, #src { flex: 1; min-height: 0; }
            .pane-doc.source #doc-wrap { display: none; }
        }
        .pane-doc > .content { padding: 0; }

        /* Menu bar */
        .menubar { display: flex; gap: 2px; border-bottom: 2px solid var(--text-color); padding: 2px 4px; position: relative; z-index: 5; }
        .menubar .m { position: relative; }
        .menubar .top, .menu button {
            border: 0; background: var(--win-bg-color); color: var(--text-color);
            font: inherit; padding: 3px 10px; cursor: var(--cur-pointer, pointer);
        }
        .menubar .top:hover, .menubar .m.open > .top, .menu button:hover, .menu button:focus-visible {
            background: var(--text-color); color: var(--win-bg-color); outline: none;
        }
        .menu { display: none; position: absolute; top: 100%; left: 0; min-width: 210px; background: var(--win-bg-color); border: 2px solid var(--text-color); padding: 2px 0; }
        .menubar .m.open > .menu { display: block; }
        .menu button { display: flex; justify-content: space-between; gap: 24px; width: 100%; text-align: left; }
        .menu button kbd, .menu button .k { font: inherit; border: 0; padding: 0; background: none; min-width: 0; }
        .menu hr { border: 0; height: 2px; background: var(--text-color); margin: 2px 0; }

        /* Tag bar: one emoji per tag; the name is in the tooltip. */
        .tb { display: flex; flex-wrap: wrap; gap: 3px; padding: 5px 6px; border-bottom: 2px solid var(--text-color); }
        .tb button, .sk-tools button {
            border: 2px solid var(--text-color); background: var(--win-bg-color); color: var(--text-color);
            font-size: 17px; line-height: 1; min-width: 32px; height: 30px; padding: 0 4px; cursor: var(--cur-pointer, pointer);
        }
        .tb button.on, .tb button:hover, .tb button:focus-visible, .sk-tools button.on, .sk-tools button:hover, .sk-tools button:focus-visible { background: var(--text-color); color: var(--win-bg-color); outline: none; }
        /* A letter where a picture would say less: Italic is an italic serif I. */
        .tb .glyph { font-family: var(--font-body); font-style: italic; font-weight: bold; font-size: 20px; }
        .tb .sep, .sk-tools .sep { width: 2px; background: var(--text-color); margin: 0 3px; }

        /* The page being written. Looks like an article. */
        #doc-wrap { overflow: auto; display: flex; flex-direction: column; }
        #doc { padding: 0 18px 14px; min-height: 320px; outline: none; flex: 1; overflow-wrap: anywhere; }
        /* Title and description, as the post shows them; click to change. */
        #doc-head { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 14px 18px 4px; cursor: var(--cur-pointer); }
        #doc-h1 { display: block; font-size: 2em; font-weight: bold; line-height: 1.2; }
        #doc-desc { display: block; font-style: italic; margin-top: 8px; }
        #doc-h1:empty::before { content: 'untitled'; } #doc-desc:empty { display: none; }
        #doc, #src, input, textarea { caret-color: var(--text-color); }
        #doc > * { margin-top: 0; }
        #doc aside { border-left: 6px solid var(--text-color); padding: 6px 12px; margin: 12px 0; font-style: italic; }
        #doc blockquote { border-left: 2px solid var(--text-color); margin: 12px 0; padding: 2px 14px; }
        #doc pre { border: 1px solid var(--text-color); padding: 8px; overflow: auto; white-space: pre-wrap; }
        #doc code, #doc kbd { border: 1px solid var(--text-color); padding: 0 3px; font-family: monospace; }
        #doc abbr { text-decoration: underline dotted; }
        #doc img { max-width: 100%; max-height: 300px; display: block; margin: 12px auto; border: 2px solid var(--text-color); }
        #doc iframe { display: block; margin: 12px auto; max-width: 100%; border: 2px solid var(--text-color); }
        #doc figure { margin: 12px 0; } #doc figcaption { text-align: center; font-style: italic; }
        #doc table { border-collapse: collapse; margin: 12px 0; } #doc td, #doc th { border: 1px solid var(--text-color); padding: 4px 8px; min-width: 3em; }
        #doc ul { list-style: disc; padding-left: 2em; } #doc ol { list-style: decimal; padding-left: 2em; }
        #doc hr { border: none; height: 1px; background: var(--text-color); }
        /* A note for Claude: kept in the file as an HTML comment, never shown or translated. */
        #doc p[data-note] { border: 2px dashed var(--text-color); padding: 4px 8px; font-family: monospace; font-size: 14px; }
        #doc p[data-note]::before { content: '🤖 '; }
        /* A translator note: shown here, kept out of the article, saved beside the English. */
        #doc span[data-tl] { text-decoration: underline wavy; text-underline-offset: 3px; cursor: help; }
        #doc:empty::before { content: attr(data-empty); }
        /* Kept as is: what an opened post has that the editor doesn't write (a drawn figure, a demo), shown as the post shows it. */
        #doc > div[data-raw] { border: 2px dotted var(--text-color); margin: 12px 0; padding: 4px; overflow: auto; }
        /* A sketch: click to draw on it again. */
        #doc > div[data-raw]:has(> figure[data-sketch]) { border-style: dashed; cursor: var(--cur-pointer); }
        #doc figure[data-sketch] { margin: 0; }
        figure.sketch svg, #sk { display: block; width: 100%; max-width: 640px; height: auto; margin: 0 auto; color: var(--text-color); }
        figure.sketch text, #sk text { font-family: var(--font-body); }
        #src { display: none; border: none; resize: none; padding: 10px; min-height: 320px; white-space: pre; font-family: monospace; font-size: 12px; background: var(--win-bg-color); color: var(--text-color); }
        .pane-doc.source #doc-wrap { display: none; } .pane-doc.source #src { display: block; }
        .status { display: flex; gap: 12px; flex-wrap: wrap; border-top: 2px solid var(--text-color); padding: 3px 8px; font-size: 13px; }
        .status a { color: inherit; }

        /* Dialogs. Not .window: the site's phone layout pins windows to a corner. */
        .dlg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; z-index: 80; background: var(--win-bg-color); color: var(--text-color); border: 2px solid var(--text-color); }
        .dlg[hidden] { display: none; }
        .dlg.wide { width: min(860px, calc(100vw - 32px)); }
        .dlg .title-bar { display: flex; justify-content: space-between; align-items: center; cursor: var(--cur-default); }
        .dlg .close-btn { background: none; border: 0; color: inherit; font-size: 1.2rem; cursor: var(--cur-pointer, pointer); }
        .dlg .body { padding: 12px 14px; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .field label { font-weight: bold; font-size: 14px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row .field { flex: 1; min-width: 140px; }
        input[type="text"], input[type="password"], input[type="url"], textarea, select, .datebtn {
            width: 100%; box-sizing: border-box; padding: 6px;
            border: 2px solid var(--text-color); background: var(--win-bg-color);
            color: var(--text-color); font-family: inherit; font-size: inherit;
        }
        textarea { resize: vertical; }
        textarea.out { min-height: 140px; white-space: pre; font-family: monospace; font-size: 12px; }
        .chips, .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .bar { margin: 8px 0; }
        .chip {
            border: 2px solid var(--text-color); background: var(--win-bg-color); color: var(--text-color);
            padding: 2px 8px; cursor: var(--cur-pointer, pointer); font-family: monospace; font-size: 13px;
        }
        .chip.on, .chip:hover, .chip:focus-visible { background: var(--text-color); color: var(--win-bg-color); outline: none; }
        .datebtn { text-align: left; cursor: var(--cur-pointer); }
        #slug-warn, #prefix-warn, .hint { font-size: 13px; }
        .posts button { display: flex; justify-content: space-between; gap: 16px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--text-color); background: none; color: inherit; font: inherit; padding: 6px 4px; cursor: var(--cur-pointer, pointer); }
        .posts button:hover, .posts button:focus-visible { background: var(--text-color); color: var(--win-bg-color); outline: none; }
        .posts time { white-space: nowrap; }
        /* The sketch pad */
        .sk-tools { display: flex; flex-wrap: wrap; gap: 3px; }
        .sk-tools .sep { align-self: stretch; }
        #sk-wrap { position: relative; border: 2px solid var(--text-color); margin: 8px 0; }
        #sk { max-width: none; background: var(--win-bg-color); touch-action: none; cursor: var(--cur-default); }
        #sk-text { position: absolute; width: 14em; padding: 2px 4px; }
        .shortcuts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
        .shortcuts dt { font-family: monospace; } .shortcuts dd { margin: 0; }
        /* The site's calendar (as in the CT125 manual), never the browser's. */
        .cal { position: absolute; z-index: 90; width: 292px; padding: 8px; background: var(--win-bg-color); color: var(--text-color); border: 2px solid var(--text-color); }
        .cal button { border: 1px solid transparent; background: none; color: inherit; padding: 0; font: inherit; cursor: var(--cur-pointer); }
        .cal button:hover, .cal button:focus-visible { border-color: var(--text-color); outline: none; }
        .cal-head { display: flex; align-items: center; gap: 2px; margin-bottom: 6px; }
        .cal-head b { flex: 1; text-align: center; }
        .cal-head button { width: 32px; height: 32px; font-size: 1.1rem; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
        .cal-dow { text-align: center; font-size: .78rem; font-weight: bold; padding: 2px 0; }
        .cal-day { height: 36px; font-variant-numeric: tabular-nums; }
        .cal-day.today { border: 1px dashed var(--text-color) !important; }
        .cal .cal-day[aria-pressed="true"] { background: var(--text-color); color: var(--win-bg-color); border-color: var(--text-color); }
        .cal-foot { display: flex; justify-content: space-between; margin-top: 6px; }
        .cal-foot button { padding: 4px 10px; border-color: var(--text-color); }
    </style>
</head>
<body class="eink-mode light-mode">
<div class="forge">
    <div class="sheet pane-doc">
        <div class="title-bar"><span class="title">🖋 sofrut.ii · <span id="doc-name">untitled</span></span></div>
        <div class="content">
            <nav class="menubar" id="menubar" aria-label="Menu">
                <div class="m"><button class="top" type="button" aria-haspopup="true">File</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="new">New…</button>
                        <button type="button" data-act="open">Open… <span class="k" data-keys="mod+O"></span></button>
                        <button type="button" data-act="save">Save draft <span class="k" data-keys="mod+S"></span></button>
                        <hr>
                        <button type="button" data-act="publish">Publish to GitHub</button>
                        <button type="button" data-act="download">Download files</button>
                        <hr>
                        <button type="button" data-act="github">GitHub settings…</button>
                    </div>
                </div>
                <div class="m"><button class="top" type="button" aria-haspopup="true">Edit</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="undo">Undo <span class="k" data-keys="mod+Z"></span></button>
                        <button type="button" data-act="redo">Redo <span class="k" data-keys="mod+shift+Z"></span></button>
                        <hr>
                        <button type="button" data-act="props">Title &amp; tags…</button>
                    </div>
                </div>
                <div class="m"><button class="top" type="button" aria-haspopup="true">View</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="source">Source <span class="k" data-keys="mod+/"></span></button>
                        <button type="button" data-act="files">Output files</button>
                        <hr>
                        <button type="button" data-act="keys">Keyboard shortcuts</button>
                    </div>
                </div>
            </nav>
            <div class="tb" id="tb" role="toolbar" aria-label="Tags"></div>
            <div id="doc-wrap">
                <button type="button" id="doc-head" title="Title &amp; tags"><span id="doc-h1"></span><span id="doc-desc"></span></button>
                <div id="doc" contenteditable="true" spellcheck="true" data-empty="…"></div>
            </div>
            <textarea id="src" spellcheck="false" aria-label="HTML source"></textarea>
            <div class="status"><span id="stats"></span><span id="pub-status" aria-live="polite"></span></div>
        </div>
    </div>
</div>

<!-- Title, slug, prefix, date, author, keywords -->
<div class="dlg" id="dlg-props" hidden role="dialog" aria-modal="true" aria-labelledby="props-title">
    <div class="title-bar"><span class="title" id="props-title">▤ article</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label for="title">title</label><input type="text" id="title"></div>
        <div class="field"><label for="desc">description</label><input type="text" id="desc"></div>
        <div class="row">
            <div class="field"><label for="slug">slug</label><input type="text" id="slug"><span id="slug-warn"></span></div>
            <div class="field"><label for="prefix">prefix</label><input type="text" id="prefix"><span id="prefix-warn"></span></div>
        </div>
        <div class="row">
            <div class="field"><label for="date">date</label><button type="button" class="datebtn" id="date" data-value=""></button></div>
            <div class="field"><label for="author">author</label><input type="text" id="author" value="Wendy Zhulkovsky"></div>
        </div>
        <div class="field"><label>keywords</label>
            <div class="chips" id="kw-pool"></div>
            <div class="bar"><input type="text" id="kw-new" style="max-width: 12em;" aria-label="new keyword"><button class="chip" type="button" id="kw-add">+</button></div>
        </div>
        <div class="bar"><button class="chip" type="button" data-close>done</button></div>
    </div>
</div>

<!-- GitHub: the token stays in this browser -->
<div class="dlg" id="dlg-github" hidden role="dialog" aria-modal="true" aria-labelledby="gh-title">
    <div class="title-bar"><span class="title" id="gh-title">⚙ github</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label for="gh-token">token</label><input type="password" id="gh-token" autocomplete="off" spellcheck="false">
            <span class="hint">A fine-grained token for this repository only, with Contents and Pull requests set to read and write: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">create one</a>. It is kept in this browser.</span></div>
        <div class="row">
            <div class="field"><label for="gh-repo">repository</label><input type="text" id="gh-repo" value="pelmeniboiler/pelmeniboiler.github.io" spellcheck="false"></div>
            <div class="field"><label for="gh-base">branch</label><input type="text" id="gh-base" value="main" spellcheck="false"></div>
        </div>
        <div class="field"><label for="gh-mode">publish as</label>
            <select id="gh-mode"><option value="pr">a pull request</option><option value="direct">a commit straight to the branch</option></select></div>
        <div class="bar"><button class="chip" type="button" id="gh-save">save</button><button class="chip" type="button" id="gh-forget">forget token</button></div>
    </div>
</div>

<!-- The two files -->
<div class="dlg wide" id="dlg-files" hidden role="dialog" aria-modal="true" aria-labelledby="files-title">
    <div class="title-bar"><span class="title" id="files-title">⚙ files</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label>blog/<span id="out-html-name">…</span></label>
            <textarea class="out" id="out-html" readonly></textarea>
            <div class="bar"><button class="chip" type="button" data-copy="out-html">copy</button></div></div>
        <div class="field"><label>localization/<span id="out-json-name">…</span></label>
            <textarea class="out" id="out-json" readonly></textarea>
            <div class="bar"><button class="chip" type="button" data-copy="out-json">copy</button></div></div>
        <div class="field" id="notes-field" hidden><label>localization/notes/<span id="out-notes-name">…</span></label>
            <textarea class="out" id="out-notes" readonly></textarea>
            <div class="bar"><button class="chip" type="button" data-copy="out-notes">copy</button></div></div>
    </div>
</div>

<!-- A published post, to edit -->
<div class="dlg" id="dlg-open" hidden role="dialog" aria-modal="true" aria-labelledby="open-title">
    <div class="title-bar"><span class="title" id="open-title">📂 open</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body"><div class="posts" id="open-list"></div></div>
</div>

<!-- The sketch pad: draw a figure as you want it; a note for Claude says what to make of it -->
<div class="dlg wide" id="dlg-sketch" hidden role="dialog" aria-modal="true" aria-labelledby="sk-title">
    <div class="title-bar"><span class="title" id="sk-title">✏️ sketch</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="sk-tools" id="sk-tools" role="toolbar" aria-label="Drawing">
            <button type="button" data-tool="pen" title="Pen">✏️</button><button type="button" data-tool="line" title="Line">╱</button><button type="button" data-tool="arrow" title="Arrow">↗</button><button type="button" data-tool="box" title="Box">▭</button><button type="button" data-tool="ellipse" title="Ellipse">◯</button><button type="button" data-tool="text" title="Text">🔤</button><button type="button" data-tool="erase" title="Eraser">🧽</button>
            <span class="sep"></span>
            <button type="button" data-sk="undo" title="Undo">↶</button><button type="button" data-sk="redo" title="Redo">↷</button><button type="button" data-sk="clear" title="Clear">🗑️</button>
            <span class="sep"></span>
            <button type="button" data-h="320">2:1</button><button type="button" data-h="427">3:2</button><button type="button" data-h="640">1:1</button>
        </div>
        <div id="sk-wrap"><svg id="sk" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 427" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-label="Sketch"></svg><input type="text" id="sk-text" hidden aria-label="Text" spellcheck="false"></div>
        <div class="bar"><button class="chip" type="button" data-close>done</button></div>
    </div>
</div>

<!-- Keyboard shortcuts -->
<div class="dlg" id="dlg-keys" hidden role="dialog" aria-modal="true" aria-labelledby="keys-title">
    <div class="title-bar"><span class="title" id="keys-title">⌨ keys</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body"><dl class="shortcuts" id="keys-list"></dl></div>
</div>

<!-- Small questions: address, alt text, caption, expansion -->
<div class="dlg" id="dlg-ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="title-bar"><span class="title" id="ask-title"></span><button class="close-btn" type="button" data-close>&times;</button></div>
    <form class="body" id="ask-form"><div id="ask-fields"></div><div class="bar"><button class="chip" type="submit">ok</button></div></form>
</div>

<script>
(function () {
    // The editor's own elements, looked up once: an opened post can have elements with the same ids.
    const UI = new Map([...document.querySelectorAll('[id]')].map((e) => [e.id, e]));
    const $ = (id) => UI.get(id) || document.getElementById(id);
    const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const doc = $('doc'), src = $('src');
    const DRAFT = 'pelmeniboiler-sofrut2-draft', GH = 'pelmeniboiler-sofrut2-github';
    const ZW = '​'; // a foothold for the caret when a tag is started or left
    const MAC = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
    // "mod+shift+Z" → "⌘⇧Z" on a Mac, "Ctrl+Shift+Z" elsewhere.
    const keyLabel = (k) => k.split('+').map((p) => ({ mod: MAC ? '⌘' : 'Ctrl', shift: MAC ? '⇧' : 'Shift', alt: MAC ? '⌥' : 'Alt' })[p] || p).join(MAC ? '' : '+');
    document.querySelectorAll('[data-keys]').forEach((k) => { k.textContent = keyLabel(k.dataset.keys); });

    // ---------- dialogs and menus ----------
    let lastFocus = null, lastSel = null;
    // A dialog remembers the editor's selection: focusing the editor again would otherwise drop it at the start.
    function openDlg(id) { lastFocus = document.activeElement; lastSel = lastRange && lastRange.cloneRange(); closeMenus(); const d = $(id); d.hidden = false; (d.querySelector('input:not([hidden]), select, textarea, button:not([data-close])') || d).focus(); }
    function closeDlg(d) {
        d.hidden = true;
        if (!lastFocus || !document.contains(lastFocus)) return;
        lastFocus.focus({ preventScroll: true });
        if (lastFocus === doc && lastSel && doc.contains(lastSel.startContainer)) { const s = getSelection(); s.removeAllRanges(); s.addRange(lastSel); lastRange = lastSel.cloneRange(); }
    }
    document.querySelectorAll('.dlg').forEach((d) => d.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeDlg(d); }));
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const open = [...document.querySelectorAll('.dlg:not([hidden])')].pop();
        if (open) closeDlg(open); else closeMenus();
    });
    const closeMenus = () => document.querySelectorAll('.menubar .m.open').forEach((m) => m.classList.remove('open'));
    $('menubar').addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); }); // keep the caret in the document
    $('menubar').addEventListener('click', (e) => {
        const top = e.target.closest('.top');

                case 'TABLE': if (text) keyed('table', () => `${prefix}_table${++n.table}`); break;
                case 'PRE': body.push(`${I}<pre><code>${esc(el.textContent)}</code></pre>`); break; // code is not translated
                case 'HR': body.push(`${I}<hr>`); break;
                case 'IMG': { const [sg, m] = imgOut(el); body.push(line(`img|${sg}`, m)); break; }
                case 'IFRAME': body.push(`${I}<iframe width="560" height="315" src="${esc(el.getAttribute('src'))}" title="${esc(el.getAttribute('title') || 'Video')}" frameborder="0"\n${I}    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"\n${I}    allowfullscreen style="display: block; margin: 20px auto;"></iframe>`); break;
                case 'FIGURE': { const im = el.querySelector('img'), cap = el.querySelector('figcaption'); if (!im) break; const k = cap ? keyFor(cap, 'data-key', () => `${prefix}_cap${++n.cap}`) : `${prefix}_cap${++n.cap}`; en[k] = cap ? textOf(cap, k) : '';
                    const [sg, m] = imgOut(im);
                    body.push(line(`fig|${sg}|${k}`, `<figure>\n${I}    ${m}\n${I}    <figcaption data-key="${k}"></figcaption>\n${I}</figure>`)); break; }
            }
        }
        // English that reads as it did keeps the post's own spelling of it (its entities, say).
        if (opened) for (const [k, [was, base]] of Object.entries(opened.same || {})) if (en[k] === was) en[k] = base;
        if (opened) for (const [k, list] of Object.entries(opened.left || {})) if (k in en) notes[k] = (notes[k] || []).concat(list);
        const h1Line = !opened ? `${I}<h1 id="title" data-key="${prefix}_title"></h1>` : opened.h1 ? (same('title', title) ? opened.h1.replace(/^\n/, '') : `${I}<h1 id="title" data-key="${prefix}_title"></h1>`) : null;
        const articleBody = [h1Line, descP ? line(`p|${prefix}_desc`, `<p data-key="${prefix}_desc"></p>`) : null, ...body].filter((x) => x !== null).join('\n');
        let html = `<!DOCTYPE html>
<html lang="en">

<head>
    <link id="dynamic-favicon" rel="icon" href="/logo/favicon.svg">
    <link rel="manifest" href="/manifest.json">
    <link rel="preload" href="/styles/fonts/FrankRuhl.woff2" as="font" type="font/woff2" crossorigin>
    <script src="/scripts/theme-loader.js"><\/script>
    <meta charset="UTF-8">
    <meta name="eink-compatibility" content="optimized">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="${esc([...selectedKw].join(', '))}">${desc ? `\n    <meta name="description" content="${esc(desc)}">` : ''}
    <meta name="author" content="${esc(author)}">
    <meta name="pubDate" content="${iso}">
    <meta name="translation-source" content="${prefix}">
    <title>${esc(title)}</title>
    <link rel="stylesheet" href="/styles/pelmeni2025.css">
    <link rel="stylesheet" href="/styles/article.css">
</head>

<body class="eink-mode light-mode">
    <nav id="nav-window" class="window">
        <div class="title-bar"><span class="title" data-key="win_gallerynav_title">◈ ${prefix}.nav</span><button
                class="close-btn">&times;</button></div>
        <div class="content">
            <ul>
                <h1 data-key="${prefix}_nav_title"></h1>
${nav.join('\n')}
            </ul>
            <a href="/index.html" data-key="gt_nav_h2_home">⌂←</a>
        </div>
    </nav>
    <main id="gallery-window" class="window"
        style="top: 0; left: 260px; right: 0; bottom: 0; position: absolute; z-index: var(--z-window-base);">
        <div class="title-bar"><span class="title" data-key="${prefix}_win_gallery_title">▤ ${prefix}.article</span><button
                class="close-btn">&times;</button></div>
        <article class="content">
${articleBody}
        </article>
    </main>
    <div id="settings-module-placeholder"></div>
    <div id="start-menu-module-placeholder"></div>
    <div id="share-module-placeholder"></div>
    <script src="/scripts/module-loader.js" defer><\/script>
</body>

</html>
`;
        let json = JSON.stringify({ en }, null, 2) + '\n';
        let notesJson = Object.keys(notes).length ? JSON.stringify(notes, null, 2) + '\n' : '';
        if (opened) {
            // The same file, with the article (and the nav and the meta tags that changed) written back in place.
            let h = opened.html;
            const art = articleSpan(h), tail = h.slice(art.start, art.end).match(/\s*$/)[0];
            h = h.slice(0, art.start) + '\n' + articleBody + tail + h.slice(art.end);
            const nv = opened.nav && navSpan(h, prefix);
            if (nv) { const t = h.slice(nv.start, nv.end).match(/\s*$/)[0]; h = h.slice(0, nv.start) + [navH1 ? `\n                <h1 data-key="${prefix}_nav_title"></h1>` : '', ...nav.map((x) => `\n${x}`)].join('') + t + h.slice(nv.end); }
            const setMeta = (name, v) => {
                const re = new RegExp(`(<meta\\s+name="${name}"\\s+content=")[^"]*("[^>]*>)`, 'i');
                if (re.test(h)) h = v ? h.replace(re, (_, a, b) => a + esc(v) + b) : h.replace(new RegExp(`\\n?[ \\t]*<meta\\s+name="${name}"[^>]*>`, 'i'), '');
                else if (v) h = h.replace(/([ \t]*)<title>/i, (m, sp) => `${sp}<meta name="${name}" content="${esc(v)}">\n${m}`);
            };
            const kws = [...selectedKw].join(', ');
            if (!same('title', title)) h = h.replace(/<title>[\s\S]*?<\/title>/i, () => `<title>${esc(title)}</title>`);
            if (!same('desc', desc)) setMeta('description', desc);
            if (!same('author', author)) setMeta('author', author);
            if (!same('date', dateVal())) setMeta('pubDate', iso);
            if (!same('kw', kws)) setMeta('keywords', kws);
            html = h;
            // The English the editor writes replaces the post's; a key it no longer writes goes, in every language.
            const gone = new Set(opened.owned.filter((k) => !(k in en))), all = {};
            for (const [lang, t] of Object.entries(opened.json)) { all[lang] = {}; for (const [k, v] of Object.entries(t || {})) if (!gone.has(k)) all[lang][k] = v; }
            all.en = Object.assign(all.en || {}, en);
            json = JSON.stringify(all, null, 2) + (opened.newline === false ? '' : '\n');
            const allNotes = {};
            for (const [k, v] of Object.entries(opened.notes || {})) if (!opened.owned.includes(k)) allNotes[k] = v;
            Object.assign(allNotes, notes);
            notesJson = Object.keys(allNotes).length ? JSON.stringify(allNotes, null, 2) + '\n' : '';
        }
        $('out-html').value = html; $('out-json').value = json; $('out-notes').value = notesJson;
        $('out-html-name').textContent = `${slug}.html`; $('out-json-name').textContent = $('out-notes-name').textContent = `${prefix}.json`;
        $('notes-field').hidden = !notesJson;
        changed();
        return { html, json, notesJson, slug, prefix, title, hadNotes: !!(opened && opened.notes) };
    }
    document.querySelectorAll('[data-copy]').forEach((btn) => btn.addEventListener('click', () => { const el = $(btn.dataset.copy); el.select(); if (navigator.clipboard) navigator.clipboard.writeText(el.value).catch(() => {}); }));
    function download() {
        const f = generate();
        for (const [name, text] of [[`${f.slug}.html`, f.html], [`${f.prefix}.json`, f.json], ...(f.notesJson ? [[`${f.prefix}.notes.json`, f.notesJson]] : [])]) {
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain' }));
            a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
    }

    // ---------- publish to GitHub ----------
    const ghCfg = () => { try { return JSON.parse(localStorage.getItem(GH)) || {}; } catch (_) { return {}; } };
    function openGithub() {
        const c = ghCfg(); $('gh-token').value = c.token || ''; $('gh-repo').value = c.repo || 'pelmeniboiler/pelmeniboiler.github.io';
        $('gh-base').value = c.base || 'main'; $('gh-mode').value = c.mode || 'pr'; openDlg('dlg-github');
    }
    $('gh-save').addEventListener('click', () => {
        try { localStorage.setItem(GH, JSON.stringify({ token: $('gh-token').value.trim(), repo: $('gh-repo').value.trim(), base: $('gh-base').value.trim() || 'main', mode: $('gh-mode').value })); } catch (_) { /* blocked */ }
        closeDlg($('dlg-github'));
    });
    $('gh-forget').addEventListener('click', () => { const c = ghCfg(); delete c.token; try { localStorage.setItem(GH, JSON.stringify(c)); } catch (_) { /* blocked */ } $('gh-token').value = ''; });
    let publishing = false;
    async function publish() {
        if (publishing) return;
        const c = ghCfg();
        if (!c.token) { openGithub(); return; }
        if (!$('title').value.trim() || !slugify($('slug').value) || !slugify($('prefix').value)) { openDlg('dlg-props'); checkSlug(); return; }
        if (!/^[\w.-]+\/[\w.-]+$/.test(c.repo || '')) { openGithub(); return; }
        if (slugTaken() && !confirm('A post with this slug already exists. Publishing replaces its files. Continue?')) return; // (not the post that was opened)
        const status = $('pub-status'); status.textContent = 'publishing…'; publishing = true;
        const gh = async (path, opts = {}) => {
            const r = await fetch(`https://api.github.com${path}`, { ...opts, headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
            const j = r.status === 204 ? null : await r.json().catch(() => null);
            if (!r.ok) { const e = new Error((j && j.message) || `HTTP ${r.status}`); e.status = r.status; throw e; }
            return j;
        };
        try {
            const f = generate(), [o, n] = (c.repo || '').split('/'), R = `/repos/${o}/${n}`, base = c.base || 'main';
            const branch = c.mode === 'direct' ? base : `sofrut/${f.slug}`;
            let parent = (await gh(`${R}/git/ref/heads/${base}`)).object.sha;
            if (branch !== base) {
                try { parent = (await gh(`${R}/git/ref/heads/${branch}`)).object.sha; }
                catch (e) { if (e.status !== 404) throw e; await gh(`${R}/git/refs`, { method: 'POST', body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: parent }) }); }
            }
            // Both files in one commit.
            const tree = await gh(`${R}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: (await gh(`${R}/git/commits/${parent}`)).tree.sha, tree: [
                { path: `blog/${f.slug}.html`, mode: '100644', type: 'blob', content: f.html },
                { path: `localization/${f.prefix}.json`, mode: '100644', type: 'blob', content: f.json },
                ...(f.notesJson ? [{ path: `localization/notes/${f.prefix}.json`, mode: '100644', type: 'blob', content: f.notesJson }]
                    : f.hadNotes ? [{ path: `localization/notes/${f.prefix}.json`, mode: '100644', type: 'blob', sha: null }] : [])] }) });
            const verb = opened ? 'Edit' : 'Post';
            const commit = await gh(`${R}/git/commits`, { method: 'POST', body: JSON.stringify({ message: `${verb}: ${f.title}`, tree: tree.sha, parents: [parent] }) });
            await gh(`${R}/git/refs/heads/${branch}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
            let url = commit.html_url || `https://github.com/${o}/${n}/commit/${commit.sha}`;
            if (c.mode !== 'direct') {
                let pr;
                try { pr = await gh(`${R}/pulls`, { method: 'POST', body: JSON.stringify({ title: `${verb}: ${f.title}`, head: branch, base, body: 'Written in sofrut.ii.' }) }); }
                catch (e) { if (e.status !== 422) throw e; pr = (await gh(`${R}/pulls?head=${encodeURIComponent(`${o}:${branch}`)}&state=open`))[0]; }
                if (pr) url = pr.html_url;
            }
            status.innerHTML = `published: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https:\/\/github\.com\//, ''))}</a>`;
        } catch (e) {
            status.textContent = e.status === 401 ? '✗ GitHub refused the token'
                : e.status === 404 ? '✗ GitHub found no such repository or branch, or the token can’t see it (File → GitHub settings)'
                : e.status === 403 ? '✗ the token isn’t allowed to do that (it needs Contents and Pull requests: read and write)'
                : e instanceof TypeError ? '✗ couldn’t reach GitHub' : `✗ ${e.message}`;
        } finally { publishing = false; }
    }

    // ---------- menu actions ----------
    const ACTIONS = {
        new: newDoc, open: openList, publish, download, github: openGithub,
        props: () => openDlg('dlg-props'),
        source: toggleSource,
        files: () => { generate(); openDlg('dlg-files'); },
        undo, redo,
        save: () => { save(); const st = $('pub-status'); if (!publishing) { st.textContent = 'draft saved'; setTimeout(() => { if (st.textContent === 'draft saved') st.textContent = ''; }, 1500); } },
        keys: () => {
            const rows = TAGS.filter((x) => x && x[3]).map((x) => [x[3], x[1].replace(/ \(.*$/, '')]).concat([['mod+Z', 'Undo'], ['mod+shift+Z', 'Redo'], ['mod+O', 'Open a post'], ['mod+S', 'Save draft'], ['mod+/', 'Source'], ['Tab', 'Next table cell (adds a row at the end)'], ['Escape', 'Close a dialog, menu or calendar'], ['F10', 'Menus (then arrows)']]);
            $('keys-list').innerHTML = rows.map(([k, n]) => `<dt>${esc(/\+/.test(k) ? keyLabel(k) : k)}</dt><dd>${esc(n)}</dd>`).join('');
            openDlg('dlg-keys');
        },
    };
    document.addEventListener('keydown', (e) => { if (e.key === 'F10') { e.preventDefault(); const t = document.querySelector('.menubar .top'); t.parentElement.classList.add('open'); t.parentElement.querySelector('.menu button').focus(); } });
    $('dlg-props').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { save(); showName(); } });
    $('doc-head').addEventListener('click', () => openDlg('dlg-props'));

    changed();
    // A blank draft starts with its title.
    if (!$('title').value.trim() && !doc.textContent.trim()) openDlg('dlg-props');
})();
</script>
<!-- The site's own parts, as on every page: themes (Funky and Zikit are set at run time), cursors, the launcher,
     and monochrome emoji. The window manager only handles .window, and letter keys ignore typing. -->
<div id="settings-module-placeholder"></div>
<div id="start-menu-module-placeholder"></div>
<script src="/scripts/module-loader.js" defer></script>
</body>
</html>
