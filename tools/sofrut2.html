<!DOCTYPE html>
<html lang="en" translate="no">
<head>
    <link id="dynamic-favicon" rel="icon" href="/logo/favicon.svg">
    <script src="/scripts/theme-loader.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Sofrut II — article scribe</title>
    <link rel="stylesheet" href="/styles/pelmeni2025.css">
    <style>
        /* Sofrut II: write a post the way it will look, then publish the two files
           the build wants (blog/<slug>.html + localization/<prefix>.json).
           Site rules apply: the theme's two colours only. */
        body { overflow: auto; padding: 12px; box-sizing: border-box; }
        .forge { max-width: 960px; margin: 0 auto; }
        .forge .window { position: relative; left: 0; top: 0; }
        @media (min-width: 900px) {
            html, body { height: 100%; }
            body { overflow: hidden; padding: 10px; }
            .forge { height: calc(100vh - 20px); }
            .pane-doc { display: flex; flex-direction: column; height: 100%; min-height: 0; }
            .pane-doc > .content { flex: 1; display: flex; flex-direction: column; min-height: 0; max-height: none; overflow: hidden; padding: 0; }
            #doc, #src { flex: 1; min-height: 0; }
        }
        .pane-doc > .content { padding: 0; }

        /* Menu bar */
        .menubar { display: flex; gap: 2px; border-bottom: 2px solid var(--text-color); padding: 2px 4px; position: relative; z-index: 5; }
        .menubar .m { position: relative; }
        .menubar .top, .menu button {
            border: 0; background: var(--win-bg-color); color: var(--text-color);
            font: inherit; padding: 3px 10px; cursor: var(--cur-pointer, pointer);
        }
        .menubar .top:hover, .menubar .m.open > .top, .menu button:hover, .menu button:focus-visible {
            background: var(--text-color); color: var(--win-bg-color); outline: none;
        }
        .menu { display: none; position: absolute; top: 100%; left: 0; min-width: 210px; background: var(--win-bg-color); border: 2px solid var(--text-color); padding: 2px 0; }
        .menubar .m.open > .menu { display: block; }
        .menu button { display: block; width: 100%; text-align: left; }
        .menu hr { border: 0; height: 2px; background: var(--text-color); margin: 2px 0; }

        /* Tag bar: one emoji per tag; the name is in the tooltip. */
        .tb { display: flex; flex-wrap: wrap; gap: 3px; padding: 5px 6px; border-bottom: 2px solid var(--text-color); }
        .tb button {
            border: 2px solid var(--text-color); background: var(--win-bg-color); color: var(--text-color);
            font-size: 17px; line-height: 1; min-width: 32px; height: 30px; padding: 0 4px; cursor: var(--cur-pointer, pointer);
        }
        .tb button.on, .tb button:hover, .tb button:focus-visible { background: var(--text-color); color: var(--win-bg-color); outline: none; }
        .tb .sep { width: 2px; background: var(--text-color); margin: 0 3px; }

        /* The page being written. Looks like an article. */
        #doc { padding: 14px 18px; overflow: auto; min-height: 320px; outline: none; }
        #doc > * { margin-top: 0; }
        #doc aside { border-left: 6px solid var(--text-color); padding: 6px 12px; margin: 12px 0; font-style: italic; }
        #doc blockquote { border-left: 2px solid var(--text-color); margin: 12px 0; padding: 2px 14px; }
        #doc pre { border: 1px solid var(--text-color); padding: 8px; overflow: auto; white-space: pre-wrap; }
        #doc code, #doc kbd { border: 1px solid var(--text-color); padding: 0 3px; font-family: monospace; }
        #doc abbr { text-decoration: underline dotted; }
        #doc img { max-width: 100%; max-height: 300px; display: block; margin: 12px auto; border: 2px solid var(--text-color); }
        #doc iframe { display: block; margin: 12px auto; max-width: 100%; border: 2px solid var(--text-color); }
        #doc figure { margin: 12px 0; } #doc figcaption { text-align: center; font-style: italic; }
        #doc table { border-collapse: collapse; margin: 12px 0; } #doc td, #doc th { border: 1px solid var(--text-color); padding: 4px 8px; min-width: 3em; }
        #doc ul { list-style: disc; padding-left: 2em; } #doc ol { list-style: decimal; padding-left: 2em; }
        #doc hr { border: none; height: 1px; background: var(--text-color); }
        /* A note for Claude: kept in the file as an HTML comment, never shown or translated. */
        #doc p[data-note] { border: 2px dashed var(--text-color); padding: 4px 8px; font-family: monospace; font-size: 14px; }
        #doc p[data-note]::before { content: '🤖 '; }
        #doc:empty::before { content: attr(data-empty); }
        #src { display: none; border: none; resize: none; padding: 10px; min-height: 320px; white-space: pre; font-family: monospace; font-size: 12px; background: var(--win-bg-color); color: var(--text-color); }
        .pane-doc.source #doc { display: none; } .pane-doc.source #src { display: block; }
        .status { display: flex; gap: 12px; flex-wrap: wrap; border-top: 2px solid var(--text-color); padding: 3px 8px; font-size: 13px; }
        .status a { color: inherit; }

        /* Dialogs. Not .window: the site's phone layout pins windows to a corner. */
        .dlg { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; z-index: 80; background: var(--win-bg-color); color: var(--text-color); border: 2px solid var(--text-color); }
        .dlg[hidden] { display: none; }
        .dlg.wide { width: min(860px, calc(100vw - 32px)); }
        .dlg .title-bar { display: flex; justify-content: space-between; align-items: center; cursor: default; }
        .dlg .close-btn { background: none; border: 0; color: inherit; font-size: 1.2rem; cursor: var(--cur-pointer, pointer); }
        .dlg .body { padding: 12px 14px; }
        .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .field label { font-weight: bold; font-size: 14px; }
        .row { display: flex; gap: 12px; flex-wrap: wrap; }
        .row .field { flex: 1; min-width: 140px; }
        input[type="text"], input[type="password"], input[type="date"], input[type="url"], textarea, select {
            width: 100%; box-sizing: border-box; padding: 6px;
            border: 2px solid var(--text-color); background: var(--win-bg-color);
            color: var(--text-color); font-family: inherit; font-size: inherit;
        }
        textarea { resize: vertical; }
        textarea.out { min-height: 140px; white-space: pre; font-family: monospace; font-size: 12px; }
        .chips, .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
        .bar { margin: 8px 0; }
        .chip {
            border: 2px solid var(--text-color); background: var(--win-bg-color); color: var(--text-color);
            padding: 2px 8px; cursor: var(--cur-pointer, pointer); font-family: monospace; font-size: 13px;
        }
        .chip.on, .chip:hover, .chip:focus-visible { background: var(--text-color); color: var(--win-bg-color); outline: none; }
        .report { border-left: 4px solid var(--text-color); padding: 4px 12px; margin-top: 8px; font-size: 13px; }
        .report .bad { font-weight: bold; text-decoration: underline; }
        .report .ok { font-weight: bold; }
        h2.sec { border-bottom: 2px solid var(--text-color); padding-bottom: 4px; font-size: 1em; }
        #slug-warn, #prefix-warn, #concept-result, .hint { font-size: 13px; }
    </style>
</head>
<body class="eink-mode light-mode">
<div class="forge">
    <div class="window pane-doc">
        <div class="title-bar"><span class="title">🖋 sofrut.ii · <span id="doc-name">untitled</span></span></div>
        <div class="content">
            <nav class="menubar" id="menubar" aria-label="Menu">
                <div class="m"><button class="top" type="button" aria-haspopup="true">File</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="new">New…</button>
                        <hr>
                        <button type="button" data-act="publish">Publish to GitHub</button>
                        <button type="button" data-act="download">Download files</button>
                        <hr>
                        <button type="button" data-act="github">GitHub settings…</button>
                    </div>
                </div>
                <div class="m"><button class="top" type="button" aria-haspopup="true">Edit</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="props">Title &amp; tags…</button>
                    </div>
                </div>
                <div class="m"><button class="top" type="button" aria-haspopup="true">View</button>
                    <div class="menu" role="menu">
                        <button type="button" data-act="source">Source</button>
                        <button type="button" data-act="files">Output files</button>
                    </div>
                </div>
                <div class="m"><button class="top" type="button" data-act="translate">Translate</button></div>
            </nav>
            <div class="tb" id="tb" role="toolbar" aria-label="Tags"></div>
            <div id="doc" contenteditable="true" spellcheck="true" data-empty="…"></div>
            <textarea id="src" spellcheck="false" aria-label="HTML source"></textarea>
            <div class="status"><span id="stats"></span><span id="pub-status" aria-live="polite"></span></div>
        </div>
    </div>
</div>

<!-- Title, slug, prefix, date, author, keywords -->
<div class="dlg" id="dlg-props" hidden role="dialog" aria-modal="true" aria-labelledby="props-title">
    <div class="title-bar"><span class="title" id="props-title">▤ article</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label for="title">title</label><input type="text" id="title"></div>
        <div class="row">
            <div class="field"><label for="slug">slug</label><input type="text" id="slug"><span id="slug-warn"></span></div>
            <div class="field"><label for="prefix">prefix</label><input type="text" id="prefix"><span id="prefix-warn"></span></div>
        </div>
        <div class="row">
            <div class="field"><label for="date">date</label><input type="date" id="date"></div>
            <div class="field"><label for="author">author</label><input type="text" id="author" value="Wendy Zhulkovsky"></div>
        </div>
        <div class="field"><label>keywords</label>
            <div class="chips" id="kw-pool"></div>
            <div class="bar"><input type="text" id="kw-new" style="max-width: 12em;" aria-label="new keyword"><button class="chip" type="button" id="kw-add">+</button></div>
        </div>
        <div class="bar"><button class="chip" type="button" data-close>done</button></div>
    </div>
</div>

<!-- GitHub: the token stays in this browser -->
<div class="dlg" id="dlg-github" hidden role="dialog" aria-modal="true" aria-labelledby="gh-title">
    <div class="title-bar"><span class="title" id="gh-title">⚙ github</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label for="gh-token">token</label><input type="password" id="gh-token" autocomplete="off" spellcheck="false">
            <span class="hint">A fine-grained token for this repository only, with Contents and Pull requests set to read and write: <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">create one</a>. It is kept in this browser.</span></div>
        <div class="row">
            <div class="field"><label for="gh-repo">repository</label><input type="text" id="gh-repo" value="pelmeniboiler/pelmeniboiler.github.io" spellcheck="false"></div>
            <div class="field"><label for="gh-base">branch</label><input type="text" id="gh-base" value="main" spellcheck="false"></div>
        </div>
        <div class="field"><label for="gh-mode">publish as</label>
            <select id="gh-mode"><option value="pr">a pull request</option><option value="direct">a commit straight to the branch</option></select></div>
        <div class="bar"><button class="chip" type="button" id="gh-save">save</button><button class="chip" type="button" id="gh-forget">forget token</button></div>
    </div>
</div>

<!-- The two files -->
<div class="dlg wide" id="dlg-files" hidden role="dialog" aria-modal="true" aria-labelledby="files-title">
    <div class="title-bar"><span class="title" id="files-title">⚙ files</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="field"><label>blog/<span id="out-html-name">…</span></label>
            <textarea class="out" id="out-html" readonly></textarea>
            <div class="bar"><button class="chip" type="button" data-copy="out-html">copy</button></div></div>
        <div class="field"><label>localization/<span id="out-json-name">…</span></label>
            <textarea class="out" id="out-json" readonly></textarea>
            <div class="bar"><button class="chip" type="button" data-copy="out-json">copy</button></div></div>
    </div>
</div>

<!-- Translate: prompt out, reply back, check, merge -->
<div class="dlg wide" id="dlg-translate" hidden role="dialog" aria-modal="true" aria-labelledby="tl-title">
    <div class="title-bar"><span class="title" id="tl-title">文 translate</span><button class="close-btn" type="button" data-close>&times;</button></div>
    <div class="body">
        <div class="row">
            <div class="field"><label for="mtpe-lang">language</label>
                <select id="mtpe-lang"><option value="he">he</option><option value="ru">ru</option><option value="de">de</option><option value="ja">ja</option><option value="gt">gt</option></select></div>
            <div class="field" style="flex: 2;"><label for="glossary">glossary</label><textarea id="glossary" rows="2" placeholder="English term = target term"></textarea></div>
        </div>
        <div class="bar"><input type="text" id="concept-term" placeholder="wikidata" style="max-width: 14em;" aria-label="term to look up"><button class="chip" type="button" id="concept-lookup">look up</button></div>
        <div id="concept-result"></div>
        <div class="bar"><button class="chip" type="button" id="mk-prompt">prompt</button><button class="chip" type="button" data-copy="prompt-out">copy</button></div>
        <textarea class="out" id="prompt-out" readonly aria-label="prompt"></textarea>
        <h2 class="sec">reply</h2>
        <textarea class="out" id="paste-in" aria-label="reply"></textarea>
        <div class="bar"><button class="chip" type="button" id="validate">check</button><button class="chip" type="button" id="merge">merge</button></div>
        <div class="report" id="report" hidden></div>
    </div>
</div>

<!-- Small questions: address, alt text, caption, expansion, date -->
<div class="dlg" id="dlg-ask" hidden role="dialog" aria-modal="true" aria-labelledby="ask-title">
    <div class="title-bar"><span class="title" id="ask-title"></span><button class="close-btn" type="button" data-close>&times;</button></div>
    <form class="body" id="ask-form"><div id="ask-fields"></div><div class="bar"><button class="chip" type="submit">ok</button></div></form>
</div>

<script>
(function () {
    const $ = (id) => document.getElementById(id);
    const slugify = (s) => s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const isGraflect = (c) => c >= 0xec70 && c <= 0xecef;
    const doc = $('doc'), src = $('src');
    const DRAFT = 'pelmeniboiler-sofrut2-draft', GH = 'pelmeniboiler-sofrut2-github';
    const ZW = '​'; // a foothold for the caret when a tag is started or left

    // ---------- dialogs and menus ----------
    let lastFocus = null;
    function openDlg(id) { lastFocus = document.activeElement; closeMenus(); const d = $(id); d.hidden = false; (d.querySelector('input, select, textarea, button:not([data-close])') || d).focus(); }
    function closeDlg(d) { d.hidden = true; if (lastFocus && document.contains(lastFocus)) lastFocus.focus(); }
    document.querySelectorAll('.dlg').forEach((d) => d.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) closeDlg(d); }));
    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const open = [...document.querySelectorAll('.dlg:not([hidden])')].pop();
        if (open) closeDlg(open); else closeMenus();
    });
    const closeMenus = () => document.querySelectorAll('.menubar .m.open').forEach((m) => m.classList.remove('open'));
    $('menubar').addEventListener('mousedown', (e) => { if (e.target.closest('button')) e.preventDefault(); }); // keep the caret in the document
    $('menubar').addEventListener('click', (e) => {
        const top = e.target.closest('.top');
        if (top && !top.dataset.act) { const m = top.parentElement, was = m.classList.contains('open'); closeMenus(); m.classList.toggle('open', !was); return; }
        const b = e.target.closest('[data-act]'); if (!b) return;
        closeMenus(); ACTIONS[b.dataset.act]();
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.menubar')) closeMenus(); });

    // ask([{ id, label, type, value }]) → values by id, or null if cancelled.
    function ask(title, fields) {
        return new Promise((resolve) => {
            $('ask-title').textContent = title;
            $('ask-fields').innerHTML = fields.map((f) => `<div class="field"><label for="ask-${f.id}">${esc(f.label)}</label><input type="${f.type || 'text'}" id="ask-${f.id}" value="${esc(f.value || '')}" spellcheck="false"></div>`).join('');
            const d = $('dlg-ask'), form = $('ask-form');
            const done = (v) => { form.onsubmit = null; observer.disconnect(); if (!d.hidden) closeDlg(d); resolve(v); };
            const observer = new MutationObserver(() => { if (d.hidden) done(null); });
            form.onsubmit = (e) => { e.preventDefault(); done(Object.fromEntries(fields.map((f) => [f.id, $(`ask-${f.id}`).value.trim()]))); };
            openDlg('dlg-ask'); observer.observe(d, { attributes: true, attributeFilter: ['hidden'] });
        });
    }

    // ---------- keywords, slugs ----------
    const selectedKw = new Set();
    // Prefixes other posts' keys (or the site's own: gt_nav…, win_…) already start with.
    const usedPrefixes = new Set(['en', 'he', 'ru', 'de', 'ja', 'gt', 'win', 'nav', 'global', 'index', 'lang', 'history']);
    function addChip(kw, on) {
        let b = [...$('kw-pool').children].find((c) => c.dataset.kw === kw);
        if (!b) {
            b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = kw; b.dataset.kw = kw;
            b.addEventListener('click', () => { b.classList.toggle('on'); b.classList.contains('on') ? selectedKw.add(kw) : selectedKw.delete(kw); save(); });
            $('kw-pool').appendChild(b);
        }
        b.classList.toggle('on', !!on); on ? selectedKw.add(kw) : selectedKw.delete(kw);
    }
    let posts = [];
    fetch('/blog/blog-manifest.json').then((r) => r.json()).then((list) => {
        posts = list;
        list.forEach((p) => p.translationSource && usedPrefixes.add(p.translationSource));
        [...new Set(list.flatMap((p) => p.keywords || []))].sort().forEach((k) => addChip(k, selectedKw.has(k)));
        checkSlug();
    }).catch(() => {});
    $('kw-add').addEventListener('click', () => { const v = $('kw-new').value.trim(); if (v) { addChip(v, true); $('kw-new').value = ''; save(); } });
    $('title').addEventListener('input', () => {
        if (!$('slug').dataset.touched) $('slug').value = slugify($('title').value);
        if (!$('prefix').dataset.touched) {
            const w = slugify($('title').value).split('-').filter(Boolean), base = w.length > 1 ? w.map((x) => x[0]).join('') : (w[0] || '');
            let pre = base, i = 2; while (pre && usedPrefixes.has(pre)) pre = `${base}${i++}`;
            $('prefix').value = pre;
        }
        checkSlug(); showName();
    });
    $('slug').addEventListener('input', () => { $('slug').dataset.touched = '1'; checkSlug(); });
    $('prefix').addEventListener('input', () => { $('prefix').dataset.touched = '1'; checkSlug(); });
    const slugTaken = () => { const s = slugify($('slug').value); return posts.some((p) => p.slug === s); };
    function checkSlug() {
        $('slug-warn').textContent = slugTaken() ? '⚠ a post with this slug exists' : '';
        $('prefix-warn').textContent = usedPrefixes.has(slugify($('prefix').value).replace(/-/g, '')) ? '⚠ already used' : '';
    }
    const showName = () => { $('doc-name').textContent = $('title').value.trim() || 'untitled'; };
    $('date').valueAsDate = new Date();

    // ---------- the editor ----------
    // Allowed markup. Everything else is unwrapped; attributes other than these are dropped.
    const BLOCKS = new Set(['P', 'H2', 'H3', 'H4', 'ASIDE', 'BLOCKQUOTE', 'PRE', 'UL', 'OL', 'HR', 'TABLE', 'FIGURE', 'IMG', 'IFRAME']);
    const FORMATS = ['B', 'STRONG', 'I', 'EM', 'S', 'U', 'CODE', 'KBD', 'SUB', 'SUP', 'INS', 'DEL', 'ABBR', 'TIME'];
    const INLINE = new Set([...FORMATS, 'A', 'BR', 'LI', 'TR', 'TD', 'TH', 'TBODY', 'THEAD', 'FIGCAPTION', 'IMG', 'UL', 'OL', 'SPAN']);
    const KEYED = ['data-key'];
    const ATTRS = { A: ['href'], IMG: ['src', 'alt', 'data-alt-key'], IFRAME: ['src', 'title'], ABBR: ['title'], TIME: ['datetime'], SPAN: ['class'], P: ['data-key', 'data-note'], ASIDE: KEYED, BLOCKQUOTE: KEYED, UL: KEYED, OL: KEYED, TABLE: KEYED, FIGCAPTION: KEYED, H2: ['data-key', 'id'], H3: ['data-key', 'id'], H4: ['data-key', 'id'] };
    // A paragraph can't hold a list, table or figure: lift those out.
    function lift(root) {
        for (const p of [...root.querySelectorAll(':scope > p')]) {
            if (p.querySelector('ul, ol, table, figure, hr, pre, aside, blockquote, h2, h3, h4, iframe')) p.replaceWith(...p.childNodes);
        }
    }
    const unwrap = (el) => el.replaceWith(...el.childNodes);
    function clean(root, final) {
        for (const el of [...root.querySelectorAll('*')]) {
            if (!el.isConnected) continue;
            if (el.tagName === 'DIV' && el.parentNode === root) { const p = document.createElement('p'); p.append(...el.childNodes); el.replaceWith(p); continue; }
            if (el.tagName === 'STRIKE') { const s = document.createElement('s'); s.append(...el.childNodes); el.replaceWith(s); continue; }
            if (!BLOCKS.has(el.tagName) && !INLINE.has(el.tagName)) { unwrap(el); continue; }
            for (const a of [...el.attributes]) if (!(ATTRS[el.tagName] || []).includes(a.name)) el.removeAttribute(a.name);
            if (el.tagName === 'SPAN' && el.className !== 'symbol') unwrap(el);
            if (el.tagName === 'IFRAME' && !/^https:\/\//.test(el.getAttribute('src') || '')) el.remove();
        }
        if (final) {
            // The caret's footholds go, and with them tags left empty.
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); const texts = [];
            while (walker.nextNode()) texts.push(walker.currentNode);
            texts.forEach((t) => {
                if (t.data.includes(ZW)) t.data = t.data.split(ZW).join('');
                // The browser writes a space typed just before or after a tag as a no-break space.
                if (t.nextSibling && t.nextSibling.nodeType === 1) t.data = t.data.replace(/\u00A0$/, ' ');
                if (t.previousSibling && t.previousSibling.nodeType === 1) t.data = t.data.replace(/^\u00A0/, ' ');
            });
            for (const el of [...root.querySelectorAll(FORMATS.join(','))]) if (!el.textContent && !el.querySelector('img')) el.remove();
        }
        lift(root);
        for (const n of [...root.childNodes]) {
            if (n.nodeType === 3 && n.data.replace(ZW, '').trim()) { const p = document.createElement('p'); n.replaceWith(p); p.append(n); }
            else if (n.nodeType === 1 && !BLOCKS.has(n.tagName)) { const p = document.createElement('p'); n.replaceWith(p); p.append(n); }
        }
        return root;
    }

        if (!c.token) { openGithub(); return; }
        if (!$('title').value.trim()) { openDlg('dlg-props'); return; }
        if (slugTaken() && !confirm('A post with this slug already exists. Publishing replaces its files. Continue?')) return;
        const status = $('pub-status'); status.textContent = 'publishing…';
        const gh = async (path, opts = {}) => {
            const r = await fetch(`https://api.github.com${path}`, { ...opts, headers: { Authorization: `Bearer ${c.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.body ? { 'Content-Type': 'application/json' } : {}) } });
            const j = r.status === 204 ? null : await r.json().catch(() => null);
            if (!r.ok) { const e = new Error((j && j.message) || `HTTP ${r.status}`); e.status = r.status; throw e; }
            return j;
        };
        try {
            const f = generate(), [o, n] = (c.repo || '').split('/'), R = `/repos/${o}/${n}`, base = c.base || 'main';
            const branch = c.mode === 'direct' ? base : `sofrut/${f.slug}`;
            let parent = (await gh(`${R}/git/ref/heads/${base}`)).object.sha;
            if (branch !== base) {
                try { parent = (await gh(`${R}/git/ref/heads/${branch}`)).object.sha; }
                catch (e) { if (e.status !== 404) throw e; await gh(`${R}/git/refs`, { method: 'POST', body: JSON.stringify({ ref: `refs/heads/${branch}`, sha: parent }) }); }
            }
            // Both files in one commit.
            const tree = await gh(`${R}/git/trees`, { method: 'POST', body: JSON.stringify({ base_tree: (await gh(`${R}/git/commits/${parent}`)).tree.sha, tree: [
                { path: `blog/${f.slug}.html`, mode: '100644', type: 'blob', content: f.html },
                { path: `localization/${f.prefix}.json`, mode: '100644', type: 'blob', content: f.json }] }) });
            const commit = await gh(`${R}/git/commits`, { method: 'POST', body: JSON.stringify({ message: `Post: ${f.title}`, tree: tree.sha, parents: [parent] }) });
            await gh(`${R}/git/refs/heads/${branch}`, { method: 'PATCH', body: JSON.stringify({ sha: commit.sha }) });
            let url = commit.html_url || `https://github.com/${o}/${n}/commit/${commit.sha}`;
            if (c.mode !== 'direct') {
                let pr;
                try { pr = await gh(`${R}/pulls`, { method: 'POST', body: JSON.stringify({ title: `Post: ${f.title}`, head: branch, base, body: 'Written in sofrut.ii.' }) }); }
                catch (e) { if (e.status !== 422) throw e; pr = (await gh(`${R}/pulls?head=${encodeURIComponent(`${o}:${branch}`)}&state=open`))[0]; }
                if (pr) url = pr.html_url;
            }
            status.innerHTML = `published: <a href="${esc(url)}" target="_blank" rel="noopener">${esc(url.replace(/^https:\/\/github\.com\//, ''))}</a>`;
        } catch (e) {
            status.textContent = e.status === 401 ? '✗ GitHub refused the token' : `✗ ${e.message}`;
        }
    }

    // ---------- translate: prompt out, reply back, check, merge ----------
    $('mk-prompt').addEventListener('click', () => {
        generate();
        const code = $('mtpe-lang').value, names = { he: 'Hebrew', ru: 'Russian', de: 'German', ja: 'Japanese', gt: 'Graflect' };
        const glossary = $('glossary').value.trim(), lines = [];
        lines.push(`You are localizing a personal blog article from English into ${names[code]} (code "${code}").`, 'Rules:',
            '- Localize, do not translate. Avoid "translatese"; preserve the author\'s voice and register.',
            '- Keep every HTML tag and entity (<br>, <span ...>, <strong>, &nbsp;, etc.) exactly where it is.',
            '- Output ONLY valid JSON: the SAME keys as the input, values translated. No commentary.');
        if (glossary) { lines.push('- Use these established terms for jargon (keep the English if you are unsure):'); glossary.split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => lines.push(`    · ${l}`)); }
        if (code === 'gt') lines.push('- Graflect is a featural phonetic script in the Unicode Private Use Area (U+EC70–U+ECEF).', '  Render the ENGLISH pronunciation in Graflect. Use ONLY Graflect glyphs — never Latin/Cyrillic/other letters inside a Graflect word.');
        lines.push('', `Output shape: { "${code}": { ...same keys, translated values... } }`, '', 'English source:', JSON.stringify({ en: lastEn }, null, 2));
        $('prompt-out').value = lines.join('\n');
    });
    // Replies come wrapped in prose or ```json fences: take the outermost object.
    function readPasted() {
        const code = $('mtpe-lang').value, raw = $('paste-in').value, a = raw.indexOf('{'), b = raw.lastIndexOf('}');
        if (a < 0 || b < a) return { error: '✗ no JSON object in the reply' };
        let data; try { data = JSON.parse(raw.slice(a, b + 1)); } catch (e) { return { error: `✗ ${e.message}` }; }
        return { code, table: data[code] || data };
    }
    $('validate').addEventListener('click', () => {
        const report = $('report'); report.hidden = false;
        if (!Object.keys(lastEn).length) generate();
        const { error, code, table } = readPasted(); if (error) { report.innerHTML = `<span class="bad">${esc(error)}</span>`; return; }
        const enKeys = Object.keys(lastEn), got = new Set(Object.keys(table));
        const missing = enKeys.filter((k) => !got.has(k)), extra = [...got].filter((k) => !enKeys.includes(k)), tagMismatch = [], bad = new Set();
        const tags = (s) => (String(s).match(/<\/?[a-z][a-z0-9]*/gi) || []).map((t) => t.toLowerCase()).sort().join();
        enKeys.forEach((k) => {
            if (table[k] == null) return;
            if (tags(lastEn[k]) !== tags(table[k])) tagMismatch.push(k);
            if (code === 'gt') String(table[k]).replace(/<[^>]*>/g, ' ').split(/\s+/).forEach((w) => { let g = false, o = false; for (const ch of w) { if (isGraflect(ch.charCodeAt(0))) g = true; else if (/\S/.test(ch)) o = true; } if (g && o) for (const ch of w) if (!isGraflect(ch.charCodeAt(0)) && /\S/.test(ch)) bad.add(ch); });
        });
        const line = (ok, good, what, list) => ok ? `<div class="ok">✓ ${good}</div>` : `<div class="bad">✗ ${what}</div><code>${esc(list.join(', '))}</code>`;
        report.innerHTML = line(!missing.length, 'keys present', `missing ${missing.length}`, missing) + (extra.length ? line(false, '', `unexpected ${extra.length}`, extra) : '')
            + line(!tagMismatch.length, 'tags preserved', 'tags differ', tagMismatch) + (code === 'gt' ? line(!bad.size, 'pure Graflect', 'stray glyphs', [...bad]) : '');
    });
    $('merge').addEventListener('click', () => {
        const { error, code, table } = readPasted(); const report = $('report'); report.hidden = false;
        if (error) { report.innerHTML = `<span class="bad">${esc(error)}</span>`; return; }
        translations[code] = { ...(translations[code] || {}), ...table }; generate();
        report.innerHTML = `<div class="ok">✓ ${code} → ${esc($('out-json-name').textContent)}</div>`;
    });
    const WD = 'https://www.wikidata.org/w/api.php', CONCEPT_LANGS = ['he', 'ja', 'de', 'ru'];
    $('concept-lookup').addEventListener('click', async () => {
        const term = $('concept-term').value.trim(), box = $('concept-result'); if (!term) return; box.textContent = '…';
        try {
            const s = await fetch(`${WD}?action=wbsearchentities&search=${encodeURIComponent(term)}&language=en&format=json&origin=*&limit=1`).then((r) => r.json());
            const hit = s.search && s.search[0]; if (!hit) { box.textContent = '∅'; return; }
            const e = await fetch(`${WD}?action=wbgetentities&ids=${hit.id}&props=labels&languages=${CONCEPT_LANGS.join('|')}&format=json&origin=*`).then((r) => r.json());
            const labels = (e.entities[hit.id] && e.entities[hit.id].labels) || {};
            box.innerHTML = `<b>${esc(hit.label)}</b> ${esc(hit.id)} ` + CONCEPT_LANGS.filter((l) => labels[l]).map((l) => `<button type="button" class="chip" data-t="${esc(labels[l].value)}">${l}: ${esc(labels[l].value)}</button>`).join(' ');
            box.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { const g = $('glossary'); g.value = (g.value.trim() ? `${g.value.trim()}\n` : '') + `${term} = ${b.dataset.t}`; save(); }));
        } catch (err) { box.textContent = `✗ ${err.message}`; }
    });

    // ---------- menu actions ----------
    const ACTIONS = {
        new: newDoc, publish, download, github: openGithub,
        props: () => openDlg('dlg-props'),
        source: toggleSource,
        files: () => { generate(); openDlg('dlg-files'); },
        translate: () => { generate(); openDlg('dlg-translate'); },
    };
    $('dlg-props').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { save(); showName(); } });

    changed();
    // A blank draft starts with its title.
    if (!$('title').value.trim() && !doc.textContent.trim()) openDlg('dlg-props');
})();
</script>
</body>
