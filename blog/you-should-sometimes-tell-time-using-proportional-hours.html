<svg class="zh-fig" viewBox="0 0 640 286" role="img" aria-labelledby="zh1-t zh1-d"><title id="zh1-t">One day, two ways to divide it</title><desc id="zh1-d">21 June in Jerusalem. The Magen Avraham counts the day from dawn to nightfall, here 72 minutes before sunrise and after sunset, so each of its twelve hours is 83 minutes. The Gra and the Baal HaTanya count from sunrise to sunset, so each hour is 71 minutes.</desc><rect class="zh-bar" x="80" y="50" width="480" height="26"/><line class="zh-tick" x1="120" y1="50" x2="120" y2="76"/><line class="zh-tick" x1="160" y1="50" x2="160" y2="76"/><line class="zh-tick" x1="200" y1="50" x2="200" y2="76"/><line class="zh-tick" x1="240" y1="50" x2="240" y2="76"/><line class="zh-tick" x1="280" y1="50" x2="280" y2="76"/><line class="zh-tick" x1="320" y1="50" x2="320" y2="76"/><line class="zh-tick" x1="360" y1="50" x2="360" y2="76"/><line class="zh-tick" x1="400" y1="50" x2="400" y2="76"/><line class="zh-tick" x1="440" y1="50" x2="440" y2="76"/><line class="zh-tick" x1="480" y1="50" x2="480" y2="76"/><line class="zh-tick" x1="520" y1="50" x2="520" y2="76"/><text class="zh-b" x="86" y="42">Magen Avraham: dawn to nightfall</text><text x="554" y="42" text-anchor="end">one hour = 83 min</text><rect class="zh-bar" x="114.6" y="130" width="410.7" height="26"/><line class="zh-tick" x1="148.9" y1="130" x2="148.9" y2="156"/><line class="zh-tick" x1="183.1" y1="130" x2="183.1" y2="156"/><line class="zh-tick" x1="217.3" y1="130" x2="217.3" y2="156"/><line class="zh-tick" x1="251.5" y1="130" x2="251.5" y2="156"/><line class="zh-tick" x1="285.8" y1="130" x2="285.8" y2="156"/><line class="zh-tick" x1="320" y1="130" x2="320" y2="156"/><line class="zh-tick" x1="354.2" y1="130" x2="354.2" y2="156"/><line class="zh-tick" x1="388.5" y1="130" x2="388.5" y2="156"/><line class="zh-tick" x1="422.7" y1="130" x2="422.7" y2="156"/><line class="zh-tick" x1="456.9" y1="130" x2="456.9" y2="156"/><line class="zh-tick" x1="491.1" y1="130" x2="491.1" y2="156"/><text class="zh-b" x="120.6" y="122">Gra, Baal HaTanya: sunrise to sunset</text><text x="519.4" y="122" text-anchor="end">one hour = 71 min</text><line class="zh-dash" x1="114.6" y1="76" x2="114.6" y2="202"/><line class="zh-dash" x1="525.4" y1="76" x2="525.4" y2="202"/><line class="zh-dash" x1="80" y1="76" x2="80" y2="240"/><line class="zh-dash" x1="560" y1="76" x2="560" y2="240"/><line class="zh-thin" x1="80" y1="104" x2="114.6" y2="104"/><line class="zh-thin" x1="80" y1="100" x2="80" y2="108"/><line class="zh-thin" x1="114.6" y1="100" x2="114.6" y2="108"/><text class="zh-s" x="74" y="108" text-anchor="end">72 min</text><line class="zh-thin" x1="525.4" y1="104" x2="560" y2="104"/><line class="zh-thin" x1="525.4" y1="100" x2="525.4" y2="108"/><line class="zh-thin" x1="560" y1="100" x2="560" y2="108"/><text class="zh-s" x="566" y="108" text-anchor="start">72 min</text><text class="zh-s" x="114.6" y="218" text-anchor="middle">netz</text><text class="zh-s" x="114.6" y="234" text-anchor="middle">sunrise</text><text class="zh-s" x="525.4" y="218" text-anchor="middle">shkia</text><text class="zh-s" x="525.4" y="234" text-anchor="middle">sunset</text><text class="zh-s" x="80" y="256" text-anchor="middle">alot hashachar</text><text class="zh-s" x="80" y="272" text-anchor="middle">dawn</text><text class="zh-s" x="560" y="256" text-anchor="middle">tzeit hakochavim</text><text class="zh-s" x="560" y="272" text-anchor="middle">nightfall</text></svg>

<svg class="zh-fig" viewBox="0 0 640 456" role="img" aria-labelledby="zh2-t zh2-d"><title id="zh2-t">How far north you are sets the length of the day</title><desc id="zh2-d">The earth on 21 June, lit from the right, its axis tilted 23.4° towards the sun; the night half is hatched. Each line is the circle a place travels in one turn; the lit part is its day. At the equator the day is about 12 hours, in Jerusalem about 14, in Stockholm over 18, and at the Arctic Circle the sun does not set.</desc><defs><clipPath id="zh2-night"><rect x="0" y="0" width="175" height="420"/></clipPath><pattern id="zh2-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="zh-hatch" x1="0" y1="0" x2="0" y2="7"/></pattern></defs><circle class="zh-day" cx="175" cy="205" r="150"/><circle fill="url(#zh2-hatch)" cx="175" cy="205" r="150" clip-path="url(#zh2-night)"/><line class="zh-thin" x1="175" y1="55" x2="175" y2="355"/><circle class="zh-rim" cx="175" cy="205" r="150"/><line class="zh-thin" x1="108.2" y1="359.1" x2="241.8" y2="50.9"/><text class="zh-s" x="246.6" y="39.9" text-anchor="middle">N</text><line class="zh-chord" x1="175" y1="55" x2="284.5" y2="102.5"/><rect class="zh-box" x="400" y="52" width="230" height="114"/><text class="zh-b" x="410" y="74">Arctic Circle, 66.6°N</text><text x="410" y="94">The whole turn is in the</text><text x="410" y="112">light. The sun does not</text><text x="410" y="130">set, and a twelfth of the</text><text x="410" y="148">day stops meaning much.</text><polyline class="zh-thin" points="284.5,102.5 380,70 400,70"/><circle class="zh-dot" cx="284.5" cy="102.5" r="3.5"/><line class="zh-halo" x1="156.1" y1="56.2" x2="175" y2="64.4"/><line class="zh-thin" x1="156.1" y1="56.2" x2="175" y2="64.4"/><line class="zh-chord" x1="175" y1="64.4" x2="296.5" y2="117.1"/><rect class="zh-box" x="400" y="178" width="230" height="78"/><text class="zh-b" x="410" y="200">Stockholm, 59.3°N</text><text x="410" y="220">18 h 37 of daylight. One</text><text x="410" y="238">hour is 93 minutes.</text><polyline class="zh-thin" points="296.5,117.1 380,196 400,196"/><circle class="zh-dot" cx="296.5" cy="117.1" r="3.5"/><line class="zh-halo" x1="89.4" y1="81.8" x2="175" y2="118.9"/><line class="zh-thin" x1="89.4" y1="81.8" x2="175" y2="118.9"/><line class="zh-chord" x1="175" y1="118.9" x2="323.4" y2="183.2"/><rect class="zh-box" x="400" y="268" width="230" height="78"/><text class="zh-b" x="410" y="290">Jerusalem, 31.8°N</text><text x="410" y="310">14 h 14 of daylight. One</text><text x="410" y="328">hour is 71 minutes.</text><polyline class="zh-thin" points="323.4,183.2 380,286 400,286"/><circle class="zh-dot" cx="323.4" cy="183.2" r="3.5"/><line class="zh-halo" x1="37.4" y1="145.3" x2="175" y2="205"/><line class="zh-thin" x1="37.4" y1="145.3" x2="175" y2="205"/><line class="zh-chord" x1="175" y1="205" x2="312.6" y2="264.7"/><rect class="zh-box" x="400" y="358" width="230" height="78"/><text class="zh-b" x="410" y="380">Equator</text><text x="410" y="400">12 h 07 of daylight. One</text><text x="410" y="418">hour is 61 minutes.</text><polyline class="zh-thin" points="312.6,264.7 380,376 400,376"/><circle class="zh-dot" cx="312.6" cy="264.7" r="3.5"/><text class="zh-s" x="400" y="30">sunlight comes from this side →</text></svg>
